<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Campus Lost & Found - Web and Mobile Application for reporting and retrieving misplaced campus items.">
  <meta name="theme-color" content="#3F51B5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Campus Lost & Found">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Campus Lost & Found</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .web-loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #3F51B5;
    }
    .web-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E2E8F0;
      border-top: 4px solid #3F51B5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="web-loading-container">
    <div class="web-spinner"></div>
    <h2 style="margin-top: 20px; font-weight: 600; color: #1E293B;">Campus Lost & Found</h2>
    <p style="color: #64748B; margin-top: -8px;">Loading application...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
